name: Bug report
description: Report incorrect analysis or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please remove secrets and private source code before sharing logs or examples."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the smallest safe example and commands to reproduce the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ChangeScope version
      placeholder: "0.1.0a0 or git commit"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, and relevant project layout.
    validations:
      required: true
