name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Add impact report to pull request summary
        if: github.event_name == 'pull_request' && matrix.python-version == '3.12'
        run: |
          changescope analyze --base "origin/${{ github.base_ref }}" --head HEAD --output changescope-report.md
          {
            echo "## ChangeScope impact analysis"
            echo
            cat changescope-report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Lint
        if: matrix.python-version == '3.12'
        run: ruff check .
