[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "changescope"
version = "0.1.0a1"
description = "Local-first code change impact analysis for developers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
keywords = ["git", "impact-analysis", "dependency-graph", "testing", "developer-tools"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: 10",
  "Programming Language :: Python :: 3 :: 11",
  "Programming Language :: Python :: 3 :: 12",
  "Programming Language :: Python :: 3 :: 13",
  "Topic :: Software Development :: Quality Assurance",
]

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "build>=1.2"]

[project.scripts]
changescope = "changescope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
